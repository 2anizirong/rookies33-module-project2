{% extends "base.html" %}
{% block content %}
<h1>게시판</h1>
{% if posts %}
    {% for post in posts %}
        <div class="post">
            <h3><a href="/post/{{ post['id'] }}" style="color:#2b2d42; text-decoration:none;">{{ post['title']|safe }}</a></h3>
            <div class="meta">작성자: {{ post['author'] }} | ID: {{ post['id'] }}</div>
        </div>
    {% endfor %}
{% else %}
    <p>게시글이 없습니다.</p>
{% endif %}
{% endblock %}
