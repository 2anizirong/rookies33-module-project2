{% extends "base.html" %}
{% block content %}
<div class="post">
    <h2>{{ post['title']|safe }}</h2>
    <div class="meta">작성자: {{ post['author'] }} | 게시글 번호: {{ post['id'] }}</div>
    <hr>
    <div>{{ post['content']|safe }}</div>
    <hr>
    <a href="/">목록으로</a>
    {% if user %}
        <a href="/post/delete/{{ post['id'] }}" style="color:#d90429; margin-left:15px;"
           onclick="return confirm('삭제할까요?');">삭제</a>
    {% endif %}
</div>
{% endblock %}
